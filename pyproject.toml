[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "validaruc"
version = "0.1.0"
description = "Cliente Python mínimo para ValidaRUC: validación de RUC peruano (SUNAT)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]
keywords = ["ruc", "sunat", "peru", "validacion", "facturacion-electronica"]
authors = [{ name = "ValidaRUC" }]

[project.urls]
Homepage = "https://rapidapi.com/MohsinIshaq/api/validaruc"
Repository = "https://github.com/mohsin974/validaruc-python"

[tool.setuptools.packages.find]
include = ["validaruc*"]
